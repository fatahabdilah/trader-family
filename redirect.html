<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traders Family — Mengarahkan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#47B538;
    --green-light:#B2E5C1;
    --gray:#BBBBBB;
    --border-white-10:rgba(255,255,255,0.10);
    --bg:#000000;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);
    color:#fff;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{display:block;max-width:100%}

  /* ============ SECTION: REDIRECT ============ */
  .redirect{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    overflow-x:hidden;
    isolation:isolate;
  }
  /* background photo */
  .redirect::before{
    content:'';
    position:absolute;
    inset:0;
    background:url('Order%20Confirmation.jpg') center center / cover no-repeat;
    z-index:-2;
  }
  /* gelap di sisi kiri, memudar ke kanan */
  .redirect::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,
      rgba(0,0,0,.92)  0%,
      rgba(0,0,0,.80) 42%,
      rgba(0,0,0,.45) 68%,
      rgba(0,0,0,0)   92%);
    z-index:-1;
    pointer-events:none;
  }

  /* --- Logo bar (overlay di atas) --- */
  .redirect__logos{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:39.2px;
    padding:28px 84px;
    z-index:2;
  }
  .redirect__logo{
    height:28px;
    width:auto;
  }

  /* --- Body --- */
  .redirect__body{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    gap:37.8px;
    /* offset kiri menyusut mengikuti lebar layar; saat layar sempit
       nilainya jatuh ke 0 sehingga konten berhenti tepat di tengah */
    padding:117px 84px 33.6px;
    padding-left:clamp(24px,calc((100vw - 293px) / 2),300px);
    padding-right:clamp(24px,calc((100vw - 293px) / 2),84px);
  }

  /* --- Heading --- */
  .redirect__head{
    width:293px;
    max-width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8.4px;
    text-align:center;
  }
  .redirect__title{
    max-width:300px;
    font-size:36.4px;
    font-weight:700;
    line-height:40px;
    letter-spacing:-.02em;
  }
  .redirect__subtitle{
    max-width:293px;
    font-size:12.6px;
    font-weight:400;
    line-height:19.6px;
    color:var(--gray);
  }

  /* --- Angka hitung mundur --- */
  .redirect__count{
    /* selebar blok lain agar angkanya ikut di tengah */
    width:293px;
    max-width:100%;
    text-align:center;
    font-size:64.4px;
    font-weight:700;
    line-height:70.8px;
    font-variant-numeric:tabular-nums;
  }

  /* --- Aksi --- */
  .redirect__actions{
    width:293px;
    max-width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .redirect__hint{
    max-width:245px;
    text-align:center;
    font-size:12.6px;
    font-weight:400;
    line-height:19.6px;
    color:var(--gray);
  }

  /* --- Tombol --- */
  .btn{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4.9px;
    width:100%;
    padding:10.5px 28px;
    border:none;
    border-radius:29.4px;
    box-shadow:0 3.6px 3.39px rgba(255,255,255,0.25) inset;
    color:#fff;
    font-family:inherit;
    font-size:16.8px;
    font-weight:700;
    line-height:18.9px;
    text-align:center;
    text-decoration:none;
    cursor:pointer;
    transition:background-color .25s ease,transform .15s ease;
  }
  /* border tombol: terang di atas, meredup jadi abu di bawah */
  .btn::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:inherit;
    padding:1px;
    background:linear-gradient(180deg,
      rgba(255,255,255,1)    0%,
      rgba(255,255,255,.65) 45%,
      rgba(187,187,187,.40) 75%,
      rgba(187,187,187,.30) 100%);
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
            mask-composite:exclude;
    pointer-events:none;
    z-index:1;
    transform:translateZ(0);
  }
  .btn{will-change:transform;backface-visibility:hidden}
  .btn:active{transform:scale(.985)}
  .btn--primary{background:var(--green)}
  .btn--primary:hover{background:#54c944}

  .redirect__secure{
    text-align:center;
    font-size:10.5px;
    font-weight:400;
    line-height:21px;
    color:var(--gray);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:820px){
    /* padding kiri/kanan tetap dikendalikan clamp() di atas */
    .redirect__body{padding-top:110px;padding-bottom:40px}
  }
  @media (max-width:600px){
    .redirect__logos{gap:22.4px;padding:19.6px 16.8px}
    .redirect__logo{height:21px}
    .redirect__body{padding-top:90px;padding-bottom:33.6px;gap:28px}
    .redirect__title{font-size:23.8px;line-height:28px}
    .redirect__subtitle{font-size:11.2px;line-height:18.2px}
    .redirect__count{font-size:48px;line-height:54px}
    .btn{font-size:12.6px;padding:9.8px 16.8px}
    .redirect__secure{font-size:9.8px;line-height:16.8px}
    .redirect::before{background-position:70% center}
    /* konten sudah di tengah: gelapkan merata, bukan hanya kiri */
    .redirect::after{background:rgba(0,0,0,.78)}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<!-- ================= SECTION: MENGARAHKAN ================= -->
<section class="redirect">

  <div class="redirect__logos">
    <img class="redirect__logo" src="logo.png" alt="Traders Family" width="378" height="49">
  </div>

  <div class="redirect__body">
    <div class="redirect__head">
      <h1 class="redirect__title">Mengarahkan<br>ke halaman akun</h1>
      <p class="redirect__subtitle">Mohon tunggu sebentar. Anda akan otomatis diarahkan ke halaman resmi Traders Family</p>
    </div>

    <div class="redirect__count" id="count" aria-live="polite">3</div>

    <div class="redirect__actions">
      <p class="redirect__hint">Jika halaman tidak berpindah otomatis, klik tombol di bawah ini.</p>
      <a class="btn btn--primary" href="#" id="btnOpen">Buka Sekarang</a>
      <div class="redirect__secure">Redirecting Securely</div>
    </div>
  </div>
</section>

<script>
(function(){
  // URL tujuan pendaftaran Traders Family
  var TARGET_URL = 'https://link.tradersfamily.id/EgMFWkVUfFNIQQ';
  var seconds = 3;

  var elCount = document.getElementById('count');
  var btnOpen = document.getElementById('btnOpen');

  btnOpen.href = TARGET_URL;

  var timer = setInterval(function(){
    seconds--;
    elCount.textContent = seconds > 0 ? seconds : 0;
    if (seconds <= 0){
      clearInterval(timer);
      window.location.replace(TARGET_URL);
    }
  }, 1000);
})();
</script>

</body>
</html>
